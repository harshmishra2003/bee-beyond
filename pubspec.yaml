name: bee_beeyond
description: "Bee Beeyond - Ayurvedic, Wellness & E-Learning Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Network & API
  dio: ^5.4.3+1

  # Local Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI Utilities & Styling
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Helper Utilities
  url_launcher: ^6.3.0
  intl: ^0.19.0
  logger: ^2.3.0
  equatable: ^2.0.5
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/Bee Beeyond.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Bee Beeyond.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
